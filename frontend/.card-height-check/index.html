<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../src/App.css" />
  <style>
    body { margin: 0; background: #f8fafc; font-family: Inter, sans-serif; }
    .wrap { max-width: 420px; margin: 16px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <div class="chat-app ask-screen ask-teacher-screen">
    <div class="wrap">
      <article id="card" class="teacher-subject-card teacher-subject-card--grad-1">
        <div class="teacher-subject-card__top">
          <div>
            <h2 class="teacher-subject-card__name">Matematicas</h2>
            <span class="teacher-subject-card__students">1 estudiantes</span>
            <p class="teacher-subject-card__meta">Todos los grados · Borrador</p>
          </div>
          <div class="teacher-subject-card__badge"></div>
        </div>
        <div class="teacher-subject-card__divider"></div>
        <div class="teacher-subject-card__actions">
          <div class="teacher-subject-card__row">
            <span class="teacher-subject-card__btn">Preguntas anteriores</span>
            <span class="teacher-subject-card__btn">Preguntarle a tu profesor</span>
          </div>
        </div>
      </article>
    </div>
  </div>
  <script>
    const card = document.getElementById('card')
    const cs = getComputedStyle(card)
    document.title = [
      'h=' + Math.round(card.getBoundingClientRect().height),
      'min=' + cs.minHeight,
      'pad=' + cs.paddingTop + '/' + cs.paddingBottom,
      'w=' + window.innerWidth,
    ].join(' ')
  </script>
</body>
</html>
